<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>就诊记录 - 医院信息系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      font-size: 14px;
      background: #f4f7fb;
      color: #1f2d3d;
    }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; }

    /* 顶栏与侧边导航 */
    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 0 24px;
      background: linear-gradient(90deg, #1c5fd0, #2f8ce0);
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { font-size: 18px; font-weight: 600; letter-spacing: 1px; }
    .topnav { display: flex; gap: 20px; }
    .topnav a, .topnav span { opacity: .85; }
    .topnav a:hover { opacity: 1; text-decoration: underline; }
    .topnav .current { opacity: 1; font-weight: 600; }
    .user { margin-left: auto; font-size: 13px; opacity: .9; }

    .layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar {
      width: 200px;
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e3eaf3;
      padding: 16px 12px;
    }
    .side-nav { display: flex; flex-direction: column; gap: 4px; }
    .side-nav a, .side-nav span {
      display: block;
      padding: 10px 14px;
      border-radius: 8px;
      color: #42526e;
    }
    .side-nav a:hover { background: #f0f5ff; color: #1c5fd0; }
    .side-nav .active { background: #e8f1ff; color: #1c5fd0; font-weight: 600; }
    .side-nav .disabled { color: #a8b4c4; cursor: not-allowed; }

    /* 内容区 */
    .content { flex: 1; min-width: 0; padding: 20px 24px 48px; }
    .breadcrumb { display: flex; gap: 8px; font-size: 13px; color: #6b7c93; margin-bottom: 16px; }
    .breadcrumb a:hover { color: #1c5fd0; }
    .breadcrumb .current { color: #1f2d3d; font-weight: 600; }

    .panel {
      background: #fff;
      border: 1px solid #e3eaf3;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .panel-head h2 { font-size: 16px; }

    /* 患者信息 */
    .patient-info {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 12px 24px;
    }
    .patient-info > div { display: flex; gap: 8px; }
    .patient-info dt { color: #6b7c93; min-width: 64px; }
    .patient-info dd { font-weight: 600; }
    .allergy {
      font-size: 13px;
      color: #d4380d;
      background: #fff2e8;
      border: 1px solid #ffd8bf;
      border-radius: 12px;
      padding: 2px 10px;
    }

    /* 统计概览 */
    .summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #fff;
      border: 1px solid #e3eaf3;
      border-radius: 10px;
      padding: 14px 18px;
    }
    .stat-label { font-size: 13px; color: #6b7c93; }
    .stat-value { font-size: 22px; line-height: 1; color: #1c5fd0; }
    .stat-unit { font-size: 12px; color: #6b7c93; }

    /* 筛选表单 */
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #eef2f8;
      margin-bottom: 16px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: #6b7c93; }
    .field input, .field select {
      height: 34px;
      padding: 0 10px;
      border: 1px solid #d6dfeb;
      border-radius: 6px;
      font-size: 14px;
      color: #1f2d3d;
      background: #fff;
      outline: none;
    }
    .field input:focus, .field select:focus {
      border-color: #2f8ce0;
      box-shadow: 0 0 0 2px rgba(47, 140, 224, .15);
    }
    .field-keyword input { width: 220px; }
    .filters .actions { display: flex; gap: 10px; margin-left: auto; }

    .btn {
      height: 34px;
      padding: 0 18px;
      border: 1px solid #d6dfeb;
      border-radius: 6px;
      background: #fff;
      color: #42526e;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { border-color: #2f8ce0; color: #1c5fd0; }
    .btn-primary { background: #1c5fd0; border-color: #1c5fd0; color: #fff; }
    .btn-primary:hover { background: #2f8ce0; border-color: #2f8ce0; color: #fff; }

    /* 就诊记录表格 */
    .table-wrap { overflow-x: auto; }
    .record-table { width: 100%; border-collapse: collapse; }
    .record-table th, .record-table td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eef2f8;
      white-space: nowrap;
    }
    .record-table th { background: #f7faff; color: #42526e; font-size: 13px; font-weight: 600; }
    .record-table tbody tr:hover { background: #f7faff; }
    .record-table .empty { text-align: center; color: #6b7c93; padding: 32px 0; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 12px;
    }
    .badge-outpatient { color: #1c5fd0; background: #e8f1ff; border-color: #c7ddff; }
    .badge-emergency { color: #d4380d; background: #fff2e8; border-color: #ffd8bf; }
    .badge-inpatient { color: #087f5b; background: #e6f7f1; border-color: #b7e4d2; }

    .status { font-size: 13px; }
    .status-done { color: #087f5b; }
    .status-doing { color: #d48806; }
    .status-canceled { color: #8c8c8c; }

    .btn-link { padding: 0; border: none; background: none; color: #1c5fd0; font-size: 14px; cursor: pointer; }
    .btn-link:hover { text-decoration: underline; }

    /* 分页 */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 13px;
      color: #6b7c93;
    }
    .page-list { display: flex; gap: 6px; }
    .page-btn {
      min-width: 32px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid #d6dfeb;
      border-radius: 6px;
      background: #fff;
      color: #42526e;
      font-size: 13px;
      cursor: pointer;
    }
    .page-btn:hover:not(:disabled) { border-color: #2f8ce0; color: #1c5fd0; }
    .page-btn.active { background: #1c5fd0; border-color: #1c5fd0; color: #fff; }
    .page-btn:disabled { color: #c0c9d6; cursor: not-allowed; }

    /* 就诊详情弹窗 */
    .modal[hidden] { display: none; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-mask { position: absolute; inset: 0; background: rgba(15, 28, 48, .45); }
    .modal-dialog {
      position: relative;
      display: flex;
      flex-direction: column;
      width: min(760px, 92vw);
      max-height: 86vh;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(15, 28, 48, .25);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eef2f8;
    }
    .modal-head h3 { font-size: 16px; }
    .modal-close { border: none; background: none; color: #8c9aab; font-size: 22px; line-height: 1; cursor: pointer; }
    .modal-close:hover { color: #1f2d3d; }
    .modal-body { padding: 18px 20px; overflow-y: auto; }
    .modal-foot { padding: 12px 20px; border-top: 1px solid #eef2f8; text-align: right; }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px 24px;
      margin-bottom: 16px;
    }
    .detail-grid > div { display: flex; gap: 8px; }
    .detail-grid dt { color: #6b7c93; min-width: 72px; }
    .detail-grid dd { font-weight: 600; }
    .detail-section { margin-bottom: 16px; }
    .detail-section h4 {
      margin-bottom: 8px;
      padding-left: 8px;
      border-left: 3px solid #1c5fd0;
      font-size: 14px;
    }
    .detail-section p { line-height: 1.8; color: #42526e; }
    .order-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .order-table th, .order-table td { padding: 8px 10px; border: 1px solid #eef2f8; text-align: left; }
    .order-table th { background: #f7faff; color: #42526e; font-weight: 600; }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      .filters .actions { margin-left: 0; }
    }
  </style>
</head>

      var TYPE_CLASS = { "门诊": "badge-outpatient", "急诊": "badge-emergency", "住院": "badge-inpatient" };
      var STATUS_CLASS = { "已完成": "status-done", "进行中": "status-doing", "已取消": "status-canceled" };

      var state = { page: 1, type: "", dept: "", start: "", end: "", keyword: "" };

      var els = {
        body: document.getElementById("recordBody"),
        pageList: document.getElementById("pageList"),
        pageTotal: document.getElementById("pageTotal"),
        form: document.getElementById("filterForm"),
        type: document.getElementById("filterType"),
        dept: document.getElementById("filterDept"),
        start: document.getElementById("filterStart"),
        end: document.getElementById("filterEnd"),
        keyword: document.getElementById("filterKeyword"),
        modal: document.getElementById("detailModal"),
        modalTitle: document.getElementById("modalTitle"),
        modalBody: document.getElementById("modalBody")
      };

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function filterRecords() {
        return RECORDS.filter(function (item) {
          if (state.type && item.type !== state.type) return false;
          if (state.dept && item.dept !== state.dept) return false;
          if (state.start && item.time.slice(0, 10) < state.start) return false;
          if (state.end && item.time.slice(0, 10) > state.end) return false;
          if (state.keyword) {
            var text = (item.id + item.dept + item.doctor + item.diagnosis).toLowerCase();
            if (text.indexOf(state.keyword.toLowerCase()) === -1) return false;
          }
          return true;
        });
      }

      function renderPagination(totalPages) {
        var html = '<button type="button" class="page-btn" data-page="' + (state.page - 1) + '"' +
          (state.page === 1 ? " disabled" : "") + ">上一页</button>";
        for (var i = 1; i <= totalPages; i += 1) {
          html += '<button type="button" class="page-btn' + (i === state.page ? " active" : "") +
            '" data-page="' + i + '">' + i + "</button>";
        }
        html += '<button type="button" class="page-btn" data-page="' + (state.page + 1) + '"' +
          (state.page === totalPages ? " disabled" : "") + ">下一页</button>";
        els.pageList.innerHTML = html;
      }

      function renderTable(list) {
        var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (state.page > totalPages) state.page = totalPages;

        var rows = list.slice((state.page - 1) * PAGE_SIZE, state.page * PAGE_SIZE);

        if (!rows.length) {
          els.body.innerHTML = '<tr><td class="empty" colspan="8">没有符合条件的就诊记录</td></tr>';
        } else {
          els.body.innerHTML = rows.map(function (item) {
            return "<tr>" +
              "<td>" + escapeHtml(item.id) + "</td>" +
              '<td><span class="badge ' + TYPE_CLASS[item.type] + '">' + escapeHtml(item.type) + "</span></td>" +
              "<td>" + escapeHtml(item.dept) + "</td>" +
              "<td>" + escapeHtml(item.doctor) + "</td>" +
              "<td>" + escapeHtml(item.time) + "</td>" +
              "<td>" + escapeHtml(item.diagnosis) + "</td>" +
              '<td><span class="status ' + STATUS_CLASS[item.status] + '">' + escapeHtml(item.status) + "</span></td>" +
              '<td><button type="button" class="btn-link" data-id="' + escapeHtml(item.id) + '">查看详情</button></td>' +
              "</tr>";
          }).join("");
        }

        els.pageTotal.textContent = "共 " + list.length + " 条记录";
        renderPagination(totalPages);
      }

      function renderDetail(item) {
        var orders = item.orders.map(function (order) {
          return "<tr><td>" + escapeHtml(order.name) + "</td><td>" + escapeHtml(order.spec) +
            "</td><td>" + escapeHtml(order.usage) + "</td><td>" + escapeHtml(order.qty) + "</td></tr>";
        }).join("");

        els.modalTitle.textContent = "就诊详情 · " + item.id;
        els.modalBody.innerHTML =
          '<dl class="detail-grid">' +
          "<div><dt>就诊号</dt><dd>" + escapeHtml(item.id) + "</dd></div>" +
          "<div><dt>就诊类型</dt><dd>" + escapeHtml(item.type) + "</dd></div>" +
          "<div><dt>就诊科室</dt><dd>" + escapeHtml(item.dept) + "</dd></div>" +
          "<div><dt>接诊医生</dt><dd>" + escapeHtml(item.doctor) + "</dd></div>" +
          "<div><dt>就诊时间</dt><dd>" + escapeHtml(item.time) + "</dd></div>" +
          "<div><dt>就诊状态</dt><dd>" + escapeHtml(item.status) + "</dd></div>" +
          "<div><dt>主诊断</dt><dd>" + escapeHtml(item.diagnosis) + "</dd></div>" +
          "</dl>" +
          '<div class="detail-section"><h4>主诉</h4><p>' + escapeHtml(item.chief) + "</p></div>" +
          '<div class="detail-section"><h4>现病史</h4><p>' + escapeHtml(item.history) + "</p></div>" +
          '<div class="detail-section"><h4>体格检查</h4><p>' + escapeHtml(item.exam) + "</p></div>" +
          '<div class="detail-section"><h4>医嘱</h4><p>' + escapeHtml(item.advice) + "</p></div>" +
          '<div class="detail-section"><h4>处方明细</h4>' +
          '<table class="order-table"><thead><tr><th>药品名称</th><th>规格</th><th>用法用量</th><th>数量</th></tr></thead>' +
          "<tbody>" + (orders || '<tr><td colspan="4">无</td></tr>') + "</tbody></table></div>";
      }

      function openModal(id) {
        var item = RECORDS.filter(function (record) { return record.id === id; })[0];
        if (!item) return;
        renderDetail(item);
        els.modal.hidden = false;
      }

      function closeModal() {
        els.modal.hidden = true;
      }

      els.form.addEventListener("submit", function (event) {
        event.preventDefault();
        state.type = els.type.value;
        state.dept = els.dept.value;
        state.start = els.start.value;
        state.end = els.end.value;
        state.keyword = els.keyword.value.trim();
        state.page = 1;
        renderTable(filterRecords());
      });

      els.form.addEventListener("reset", function () {
        window.setTimeout(function () {
          state = { page: 1, type: "", dept: "", start: "", end: "", keyword: "" };
          renderTable(filterRecords());
        }, 0);
      });

      els.pageList.addEventListener("click", function (event) {
        var btn = event.target.closest(".page-btn");
        if (!btn || btn.disabled) return;
        var page = Number(btn.dataset.page);
        if (!page || page === state.page) return;
        state.page = page;
        renderTable(filterRecords());
      });

      els.body.addEventListener("click", function (event) {
        var btn = event.target.closest(".btn-link");
        if (btn) openModal(btn.dataset.id);
      });

      els.modal.addEventListener("click", function (event) {
        if (event.target.dataset.close) closeModal();
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !els.modal.hidden) closeModal();
      });

      renderTable(filterRecords());
    }());
  </script>
